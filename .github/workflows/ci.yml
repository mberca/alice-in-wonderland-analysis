name: Reproduce and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.11"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check generated evidence is fresh
        run: python -m wonderland build --check
      - name: Run corpus, pipeline, and CLI tests
        run: python -m unittest discover -s tests -v
